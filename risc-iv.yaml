limit: 2000
memory_size: 0x1000
memory_mapped_io:
  0x80: [72, 69, 76, 76, 79, 10]
  0x84: []
reports:
  - name: "Execution trace"
    slice: all
    view: |
      {pc}: {instruction:next} {pc:label}

  - name: Check results
    slice: last
    filter:
      - state
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
      symio[0x80]: {io:0x80:sym}
      symio[0x84]: {io:0x84:sym}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [72,69,76,76,79]
      symio[0x80]: "" >>> ""
      symio[0x84]: "" >>> "HELLO"
