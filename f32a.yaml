limit: 100000
memory_size: 8192

memory_mapped_io:
  0x80: [1, 100]
  0x84: []

reports:
  - name: "Execution trace"
    slice: all
    view: |
      {pc}: {instruction:next} {pc:label} {stack:dec}

  - name: "Result verification"
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [1]
